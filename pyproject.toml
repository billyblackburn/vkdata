[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "vkdata"
version = "0.1.0a1"
description = "Vulkan GPU-accelerated PyData, SciPy, HoloViz, GeoSpatial, Astrophysics, and scikit-learn stack — no CUDA required"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Billy Blackburn" }]
keywords = ["vulkan", "gpu", "numpy", "pandas", "datashader", "holoviews", "scikit-learn", "ggml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
io = ["pyarrow>=15.0"]
viz = ["pillow>=10.0", "requests>=2.31", "ipywidgets>=8.0", "anywidget>=0.9"]
all = ["pyarrow>=15.0", "pillow>=10.0", "requests>=2.31", "ipywidgets>=8.0", "anywidget>=0.9"]

[project.urls]
Homepage = "https://github.com/billyblackburn/vkdata"
Repository = "https://github.com/billyblackburn/vkdata"

[tool.scikit-build]
cmake.version = ">=3.26"
cmake.build-type = "Release"
ninja.make-fallback = false
install.components = ["vkdata"]
wheel.packages = ["vknumpy", "vkpandas", "vkshader", "vkholoviews", "vkgeoviews", "vkplot", "vklearn", "vkspatial", "vkpanel", "vkastro", "vkcolorcet", "vkscipy"]
wheel.exclude = ["**/__pycache__/**", "**/*.pyc"]
sdist.exclude = ["build/**", ".pixi/**", "third_party/**", "dist/**", "**/*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
