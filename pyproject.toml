[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vkdata"
version = "0.1.0"
description = "Vulkan GPU-accelerated PyData, HoloViz, and scikit-learn stack — no CUDA required"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["vknumpy*", "vkpandas*", "vkshader*", "vkholoviews*", "vklearn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
