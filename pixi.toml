[workspace]
name = "vkdata"
version = "0.1.0"
description = "Vulkan GPU-accelerated PyData, HoloViz, and scikit-learn stack (vknumpy, vkpandas, vkshader, vkholoviews, vklearn)"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.26"
pytest = ">=8.0"
cmake = ">=3.26"
ninja = ">=1.11"
c-compiler = "*"
cxx-compiler = "*"
vulkan-headers = ">=1.3"
spirv-headers = "*"
glslang = "*"
pkg-config = "*"
jupyterlab = ">=4.6.6,<5"
pyarrow = ">=26.0.1,<27"
pillow = ">=13.0.0,<14"
ipywidgets = ">=8.1.9,<9"
anywidget = ">=0.11.0,<0.12"
scikit-build-core = ">=1.1.2,<2"
python-build = ">=1.6.1,<2"
twine = ">=7.0.0,<8"

[tasks]
setup = "bash -c 'test -d third_party/llama.cpp || git clone --depth 1 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp; test -d third_party/ncnn || git clone --depth 1 https://github.com/Tencent/ncnn.git third_party/ncnn; python scripts/patch_ggml_vulkan.py'"
update-deps = "bash -c 'git -C third_party/llama.cpp checkout -- ggml/src/ggml-vulkan/ggml-vulkan.cpp && git -C third_party/llama.cpp pull --ff-only && git -C third_party/ncnn pull --ff-only && python scripts/patch_ggml_vulkan.py && rm -rf build && pixi run build && pixi run test'"
build = "bash -c 'VK_INC=\"\"; [ -d third_party/vulkan-include ] && VK_INC=\"-DVulkan_INCLUDE_DIR=third_party/vulkan-include\"; [ -f build/build.ninja ] || cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $VK_INC; cmake --build build --parallel'"
test = "PYTHONPATH=. pytest -v tests"
wheel = "bash -c 'rm -rf dist && python -m build --wheel --no-isolation -C build-dir=build'"
bench = "PYTHONPATH=. python benchmarks/bench_gemm.py"
lab = "PYTHONPATH=. jupyter lab examples"
