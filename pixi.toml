[workspace]
name = "vknumpy"
version = "0.1.0"
description = "NumPy drop-in accelerated by llama.cpp's ggml-vulkan GEMM and BLAS"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.26"
pytest = ">=8.0"
cmake = ">=3.26"
ninja = ">=1.11"
c-compiler = "*"
cxx-compiler = "*"
vulkan-headers = ">=1.3"
spirv-headers = "*"
pkg-config = "*"

[tasks]
setup = "test -d third_party/llama.cpp || git clone --depth 1 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp"
build = "bash -c 'VK_INC=\"\"; [ -d third_party/vulkan-include ] && VK_INC=\"-DVulkan_INCLUDE_DIR=third_party/vulkan-include\"; cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $VK_INC && cmake --build build'"
test = "PYTHONPATH=. pytest -v tests"
bench = "PYTHONPATH=. python benchmarks/bench_gemm.py"
